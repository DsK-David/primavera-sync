# Dados de um cliente para o instalador (instalar.bat).
#
# Para cada cliente: copiar para clientes/<nome>/cliente.ini (vai para o Git, que é privado: tem a chave), preencher, e levar esse
# cliente.ini para o servidor do cliente, para a mesma pasta do instalar.bat. O instalador só pergunta o que faltar.

[cliente]
nome = Nome da empresa
nif = 000000000

[lonntra]
url = https://app.lonntra.cv
# php yii integracao/chave <NIF> (no servidor da Lonntra). Várias empresas no mesmo servidor: chave = k1, k2
chave =

# Tudo o que está abaixo é opcional: se faltar, o instalador descobre ou propõe e pergunta.

# [primavera]
# instância do SQL Server e base da empresa (PRI + código)
# servidor = SERVIDOR\PRIMAVERA
# base = PRIEMPRESA

# [sincronizacao]
# valores de TipoArtigo que são serviços (sem stock)
# tipos_artigo_servico = 0
# horas para o histórico todo (vazio = já)
# historico_horario = 20-7

# [tipos_documento]
# FA = FT
# VD = TV

# [modos_pagamento]
# NUM = 10
