# Copiar para config.ini e preencher. O config.ini não vai para o Git (tem a chave).

[primavera]
# Ligação ODBC à base da empresa no SQL Server do Primavera (PRI + código da empresa).
# Usar um login só de leitura (db_datareader): o sync só faz SELECT.
ligacao = DRIVER={ODBC Driver 17 for SQL Server};SERVER=SERVIDOR\PRIMAVERA;DATABASE=PRIAUTOSTYLE;UID=lonntra_leitura;PWD=...

[lonntra]
url = http://localhost:8091
# Gerada na Lonntra com: php yii integracao/chave <NIF da empresa>
chave =

[sincronizacao]
# segundos entre ciclos
intervalo = 60
# vazio = todo o histórico na primeira corrida; depois só os documentos dos últimos `revisao_dias`
data_inicio =
revisao_dias = 30
max_tentativas = 5
moeda = CVE
# valores de TipoArtigo do Primavera que são serviços
tipos_artigo_servico =
estado = estado.db
log = primavera-sync.log

[tipos_documento]
# código do documento no Primavera = tipo na Lonntra (FT, FR, TV, NC, ND). Só estes tipos são enviados.
# FR e TV vão pagos no ato.
FA = FT
FR = FR
VD = TV
NC = NC

[modos_pagamento]
# ModoPag do Primavera = código do método de pagamento na Lonntra (10 numerário, 20 cheque, 30 transferência,
# 54 cartão de crédito, 55 cartão de débito). Sem correspondência: numerário.
NUM = 10
CHQ = 20
TRF = 30
