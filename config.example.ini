# Copiar para config.ini e preencher. O config.ini não vai para o Git (tem a chave).

[primavera]
# Ligação ODBC à base da empresa no SQL Server do Primavera (PRI + código da empresa).
# Usar um login só de leitura (db_datareader): o sync só faz SELECT.
ligacao = DRIVER={ODBC Driver 17 for SQL Server};SERVER=SERVIDOR\PRIMAVERA;DATABASE=PRIAUTOSTYLE;UID=lonntra_leitura;PWD=...

[lonntra]
url = http://localhost:8091
# Gerada na Lonntra com: php yii integracao/chave <NIF da empresa>
chave =

[sincronizacao]
# segundos entre ciclos
intervalo = 60
# vazio = todo o histórico na primeira corrida; depois só os documentos dos últimos `revisao_dias`
data_inicio =
revisao_dias = 30
moeda = CVE
# valores de TipoArtigo do Primavera que são serviços (sem stock)
tipos_artigo_servico =
# artigos, armazéns, existências e movimentos de stock (só para consulta na Lonntra): sim | não
catalogo = sim
# movimentos de entrada e saída de stock (desligar se a tabela não existir nesta versão do Primavera): sim | não
movimentos_stock = sim
# horas em que se pode enviar o histórico todo (só a primeira vez), ex.: 20-7 = das 20h às 7h; vazio = logo
historico_horario =
estado = estado.db
log = primavera-sync.log

[tipos_documento]
# código do documento no Primavera = tipo na Lonntra (FT, FR, TV, NC, ND, DV, FP, DT). Só estes tipos são enviados.
# As devoluções (DEV e DV) vão sempre como notas de devolução (DV); para as desligar: [sincronizacao] devolucoes = nao
# As guias de remessa (GR) vão sempre como documentos de transporte (DT); para as desligar: [sincronizacao] guias = nao
# Um tipo que passe a seguir depois da carga completa envia o seu histórico uma vez (dentro do historico_horario).
# FR e TV vão pagos no ato.
FA = FT
FR = FR
VD = TV
NC = NC
FP = FP    # a proforma NÃO é uma fatura: tem o seu tipo, fora das vendas e do por receber
FR1 = FR   # fatura-recibo de outra série

[modos_pagamento]
# ModoPag do Primavera = código do método de pagamento na Lonntra (10 numerário, 20 cheque, 30 transferência,
# 54 cartão de crédito, 55 cartão de débito). Sem correspondência: numerário.
NUM = 10
CHQ = 20
TRF = 30

[consultas]
# Só se as consultas de origem não servirem nesta versão do Primavera (ver primavera_sync/evolution.py, CATALOGO_SQL).
# Cada uma tem de devolver as mesmas colunas, com os mesmos nomes. Vazio = a de origem.
# artigos: Artigo, Descricao, TipoArtigo, Taxa, CodBarras, Familia, FamiliaNome, Anulado, Custo, PVP, PVPComIva (? = moeda)
artigos =
# armazens: Armazem, Descricao
armazens =
# existencias: Artigo, Armazem, Quantidade
existencias =
# movimentos: Id, Artigo, Armazem, Data, EntradaSaida (E/S), Quantidade, Documento (? = data desde quando)
movimentos =
